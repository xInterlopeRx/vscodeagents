services:
  vscode-docs-mcp:
    build:
      context: ../..
      dockerfile: deploy/vscode-docs-mcp/Dockerfile
    image: ${MCP_IMAGE:-ghcr.io/xinterloperx/vscode-docs-mcp:latest}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.50
    mem_limit: 256m
    ports:
      - "${MCP_PUBLISHED_HOST:-127.0.0.1}:${MCP_PUBLISHED_PORT:-3100}:3100"
    environment:
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 3100
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN in the deployment environment}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      VSCA_DOCS_DIR: /app/docs
      VSCA_CACHE_DIR: /home/node/.cache/vscodeagent-docs
    volumes:
      - docs-cache:/home/node/.cache/vscodeagent-docs
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3100/healthz").then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  docs-cache:
